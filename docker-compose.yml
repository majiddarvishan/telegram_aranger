services:
  telegram-harbor:
    build:
      context: .
      args:
        TELEGRAM_HARBOR_BUILD_SHA: ${TELEGRAM_HARBOR_BUILD_SHA:-local}
    env_file:
      - .env
    environment:
      YOUTUBE_DOWNLOAD_ROOTS: ${YOUTUBE_DOWNLOAD_ROOTS:-/data/youtube}
    ports:
      - "8501:8501"
    volumes:
      - telegram_data:/data
    restart: unless-stopped

volumes:
  telegram_data:
