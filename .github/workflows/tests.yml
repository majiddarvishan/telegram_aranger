name: tests

on:
  push:
    branches:
      - main
      - gui
      - feature/youtube-download
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Media cache tests
        run: python -m unittest discover -s tests -p "test_media_cache.py" -v

      - name: Branding tests
        run: python -m unittest discover -s tests -p "test_branding.py" -v

      - name: Crypto acceleration tests
        run: python -m unittest discover -s tests -p "test_crypto_acceleration.py" -v

      - name: Settings defaults tests
        run: python -m unittest discover -s tests -p "test_settings.py" -v

      - name: YouTube service tests
        run: python -m unittest discover -s tests -p "test_youtube_service.py" -v

      - name: YouTube download path tests
        run: python -m unittest discover -s tests -p "test_download_paths.py" -v

      - name: YouTube warning policy tests
        run: python -m unittest discover -s tests -p "test_youtube_policy.py" -v

      - name: YouTube download engine tests
        run: python -m unittest discover -s tests -p "test_youtube_download.py" -v

      - name: YouTube UI tests
        run: python -m unittest discover -s tests -p "test_youtube_ui.py" -v

      - name: YouTube manual-runner offline tests
        run: python -m unittest discover -s tests -p "test_youtube_manual_validate.py" -v

      - name: Import Telegram service
        run: python -c "import services.telegram_service"

      - name: Telegram media metadata tests
        run: python -m unittest -v tests.test_telegram_media.TelegramMediaMetadataTests

      - name: Telegram media download - cache reuse
        run: python -m unittest -v tests.test_telegram_media.TelegramMediaDownloadTests.test_download_is_lazy_and_reuses_fresh_cache

      - name: Telegram media download - size limit
        run: python -m unittest -v tests.test_telegram_media.TelegramMediaDownloadTests.test_download_rejects_media_over_configured_limit

      - name: Telegram media download - progress callback
        run: python -m unittest -v tests.test_telegram_media.TelegramMediaDownloadTests.test_download_reports_byte_progress

      - name: Telegram media download - failed transfer
        run: python -m unittest -v tests.test_telegram_media.TelegramMediaDownloadTests.test_failed_download_returns_clear_error

      - name: Telegram media download - force redownload
        run: python -m unittest -v tests.test_telegram_media.TelegramMediaDownloadTests.test_force_download_bypasses_valid_cache

      - name: Telegram media download - truncated cache recovery
        run: python -m unittest -v tests.test_telegram_media.TelegramMediaDownloadTests.test_truncated_cached_file_is_deleted_and_downloaded_again

      - name: Remember-me restore tests
        run: python -m unittest discover -s tests -p "test_remember_me_restore.py" -v

      - name: Authentication tests
        run: python -m unittest discover -s tests -p "test_auth.py" -v

      - name: Login security tests
        run: python -m unittest discover -s tests -p "test_login_security.py" -v

      - name: Database configuration tests
        run: python -m unittest discover -s tests -p "test_database.py" -v

      - name: Dialog cache tests
        run: python -m unittest discover -s tests -p "test_dialogs.py" -v

      - name: Structured logging tests
        run: python -m unittest discover -s tests -p "test_logging.py" -v

      - name: Backup and restore tests
        run: python -m unittest discover -s tests -p "test_backup_restore.py" -v

      - name: Telegram account tests
        run: python -m unittest discover -s tests -p "test_telegram_accounts.py" -v

      - name: Tag isolation and migration tests
        run: python -m unittest discover -s tests -p "test_tags.py" -v

      - name: History tests
        run: python -m unittest discover -s tests -p "test_history.py" -v

      - name: Date range timezone tests
        run: python -m unittest discover -s tests -p "test_date_range.py" -v

      - name: Telegram runtime shutdown tests
        run: python -m unittest discover -s tests -p "test_telegram_runtime.py" -v

      - name: Telegram thread-context tests
        run: python -m unittest discover -s tests -p "test_telegram_thread_context.py" -v

      - name: UI state smoke tests
        run: python -m unittest discover -s tests -p "test_ui_smoke.py" -v

      - name: Theme foundation tests
        run: python -m unittest discover -s tests -p "test_theme.py" -v


  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t telegram-harbor:test .

      - name: Verify FFmpeg in image
        run: |
          docker run --rm --entrypoint ffmpeg telegram-harbor:test -version
          docker run --rm --entrypoint ffprobe telegram-harbor:test -version

      - name: Start container
        run: |
          KEY="$(docker run --rm --entrypoint python telegram-harbor:test -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          docker run -d --name telegram-harbor-test \
            -p 8501:8501 \
            -e TELEGRAM_API_ID=123456 \
            -e TELEGRAM_API_HASH=test-api-hash \
            -e TELEGRAM_SESSION_ENCRYPTION_KEY="$KEY" \
            telegram-harbor:test

      - name: Verify Streamlit health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs telegram-harbor-test
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs telegram-harbor-test || true


  windows-python314:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify tgcrypto2 drop-in module
        shell: pwsh
        run: |
          python -c "import asyncio; asyncio.set_event_loop(asyncio.new_event_loop()); import tgcrypto; import pyrogram; print('tgcrypto:', tgcrypto.__file__)"

      - name: Run crypto acceleration tests
        run: python -m unittest discover -s tests -p "test_crypto_acceleration.py" -v

      - name: Run YouTube download path tests
        run: python -m unittest discover -s tests -p "test_download_paths.py" -v
