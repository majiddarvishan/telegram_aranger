name: tests

on:
  push:
    branches:
      - main
      - feature/media-support
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Media cache tests
        run: python -m unittest discover -s tests -p "test_media_cache.py" -v

      - name: Import Telegram service
        run: python -c "import services.telegram_service"

      - name: Telegram media metadata tests
        run: python -m unittest -v tests.test_telegram_media.TelegramMediaMetadataTests

      - name: Telegram media download - cache reuse
        run: python -m unittest -v tests.test_telegram_media.TelegramMediaDownloadTests.test_download_is_lazy_and_reuses_fresh_cache

      - name: Telegram media download - size limit
        run: python -m unittest -v tests.test_telegram_media.TelegramMediaDownloadTests.test_download_rejects_media_over_configured_limit

      - name: Telegram media download - progress callback
        run: python -m unittest -v tests.test_telegram_media.TelegramMediaDownloadTests.test_download_reports_byte_progress

      - name: Telegram media download - failed transfer
        run: python -m unittest -v tests.test_telegram_media.TelegramMediaDownloadTests.test_failed_download_returns_clear_error

      - name: Telegram media download - force redownload
        run: python -m unittest -v tests.test_telegram_media.TelegramMediaDownloadTests.test_force_download_bypasses_valid_cache

      - name: Telegram media download - truncated cache recovery
        run: python -m unittest -v tests.test_telegram_media.TelegramMediaDownloadTests.test_truncated_cached_file_is_deleted_and_downloaded_again

      - name: Remember-me restore tests
        run: python -m unittest discover -s tests -p "test_remember_me_restore.py" -v

      - name: Authentication tests
        run: python -m unittest discover -s tests -p "test_auth.py" -v

      - name: Login security tests
        run: python -m unittest discover -s tests -p "test_login_security.py" -v

      - name: Database configuration tests
        run: python -m unittest discover -s tests -p "test_database.py" -v

      - name: Backup and restore tests
        run: python -m unittest discover -s tests -p "test_backup_restore.py" -v

      - name: Telegram account tests
        run: python -m unittest discover -s tests -p "test_telegram_accounts.py" -v

      - name: Tag isolation and migration tests
        run: python -m unittest discover -s tests -p "test_tags.py" -v

      - name: History tests
        run: python -m unittest discover -s tests -p "test_history.py" -v

      - name: Date range timezone tests
        run: python -m unittest discover -s tests -p "test_date_range.py" -v

      - name: Telegram runtime shutdown tests
        run: python -m unittest discover -s tests -p "test_telegram_runtime.py" -v

      - name: UI state smoke tests
        run: python -m unittest discover -s tests -p "test_ui_smoke.py" -v
